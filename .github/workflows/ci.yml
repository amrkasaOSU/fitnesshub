name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (unit + integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # `verify` runs the unit tests (surefire) and then the *IT integration
      # tests (failsafe). The integration tests start their own PostgreSQL and
      # Redis with Testcontainers, using the runner's Docker daemon, so this job
      # needs no service containers.
      - name: Test
        working-directory: backend
        run: ./mvnw -B verify

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Backend coverage (JaCoCo, unit + integration)"
            echo '```'
            python3 scripts/coverage-summary.py backend/target/site/jacoco/jacoco.csv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 14

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The real stack from source: production Next.js build, Spring Boot,
      # PostgreSQL and Redis. The backend seeds the demo accounts on first boot.
      - name: Start the stack
        run: docker compose -f loadtest/docker-compose.loadtest.yml --profile ui up -d --build --wait

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

      - name: Backend logs on failure
        if: failure()
        run: docker compose -f loadtest/docker-compose.loadtest.yml logs backend | tail -200

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t fitnesshub-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t fitnesshub-frontend:ci ./frontend

      # The production stack is what actually runs on the server, so a typo in
      # it should fail here rather than on a VM with a client waiting. `config`
      # resolves every variable, volume and dependency without starting
      # anything.
      - name: Validate production compose file
        env:
          SITE_ADDRESS: ci.example.com
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate Caddyfile
        env:
          SITE_ADDRESS: ci.example.com
        run: |
          docker run --rm -e SITE_ADDRESS \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
