name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fitnesshub
          POSTGRES_USER: fitnesshub
          POSTGRES_PASSWORD: fitnesshub_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fitnesshub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Compile
        working-directory: backend
        run: ./mvnw -B -q compile
      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/fitnesshub
          POSTGRES_USER: fitnesshub
          POSTGRES_PASSWORD: fitnesshub_dev_password
          REDIS_URL: redis://localhost:6379
        run: ./mvnw -B test
      - name: Package
        working-directory: backend
        run: ./mvnw -B -q package -DskipTests

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t fitnesshub-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t fitnesshub-frontend:ci ./frontend

      # The production stack is what actually runs on the server, so a typo in
      # it should fail here rather than on a VM with a client waiting. `config`
      # resolves every variable, volume and dependency without starting
      # anything.
      - name: Validate production compose file
        env:
          SITE_ADDRESS: ci.example.com
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate Caddyfile
        env:
          SITE_ADDRESS: ci.example.com
        run: |
          docker run --rm -e SITE_ADDRESS \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
