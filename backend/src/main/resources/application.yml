spring:
  application:
    name: fitnesshub-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fitnesshub}
    username: ${POSTGRES_USER:fitnesshub}
    password: ${POSTGRES_PASSWORD:fitnesshub_dev_password}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 30
        # order_inserts/order_updates are deliberately left at their default (off): this schema
        # uses plain UUID foreign-key columns instead of JPA @ManyToOne associations everywhere,
        # so Hibernate's type-grouped insert reordering can't see the FK dependency and will
        # happily batch a child row's insert ahead of its parent's, breaking a real integrity
        # constraint. Verified against workout_exercises/workout_sets during seed data loading.

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  session:
    store-type: redis
    redis:
      namespace: fitnesshub:session
    timeout: 7d

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}

fitnesshub:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}
  cookie:
    secure: ${COOKIE_SECURE:false}
    domain: ${COOKIE_DOMAIN:}
    same-site: ${COOKIE_SAME_SITE:Lax}
  ai:
    provider: openai
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    rate-limits:
      free-per-day: 5
      premium-per-day: 50
      coach-per-day: 100
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    coach-pro-price-id: ${STRIPE_COACH_PRO_PRICE_ID:}
    client-premium-price-id: ${STRIPE_CLIENT_PREMIUM_PRICE_ID:}
  seed:
    enabled: ${SEED_ENABLED:true}

logging:
  level:
    root: INFO
    com.fitnesshub: DEBUG
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
